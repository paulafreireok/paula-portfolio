<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paula Freire — Portfolio</title><link rel="stylesheet" href="style.css"><script src="data.js"></script></head><body><nav class="topbar"><div class="roles"><span>Brand Designer</span><span class="slash">/</span><span></span><span class="slash"></span></div><a class="brand-mini" href="index.html">Home</a><div class="links"><a href="#work">Work</a><a href="#process">Process</a><a href="#about">About</a><a href="#contact">Contact</a></div></nav><div id="app"></div><script>
const data=DEFAULT_PORTFOLIO; const r=document.documentElement; Object.entries(data.theme).forEach(([k,v])=>{ if(k==='fontDisplay') r.style.setProperty('--display', `'${v}', Arial Black, sans-serif`); else if(k==='fontBody') r.style.setProperty('--body', `'${v}', system-ui, sans-serif`); else r.style.setProperty('--'+k,v); });
function esc(s=''){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function safeLink(url=''){url=String(url).trim(); if(!url || url==='#') return '#'; if(url.includes('@') && !url.startsWith('mailto:')) return 'mailto:'+url; if(!/^(https?:|mailto:|tel:|#)/i.test(url)) return 'https://'+url; return url;}
function img(src,cls=''){return src?`<img src="${esc(src)}" alt="" class="${cls}">`:`<div class="visual empty ${cls}">Add image from admin</div>`}
const cats=[...new Set(data.projects.filter(p=>p.visible).map(p=>p.category))];
document.getElementById('app').innerHTML=`
<header class="hero" id="top"><div class="hero-meta reveal"><span>${esc(data.home.location)}</span><span></span></div><h1 class="hero-title"><span class="reveal">${esc(data.home.name.split(' ')[0])}</span><span class="last reveal">${esc(data.home.name.split(' ').slice(1).join(' '))}</span></h1><div class="hero-footer"><p class="hero-kicker reveal">${esc(data.home.kicker)}</p><div class="reveal"><p class="hero-copy">${esc(data.home.intro)}</p><div class="cta-row"><a href="#work" class="btn dark">Selected Work →</a><a href="#contact" class="btn">Let’s Talk</a></div></div></div></header>
<main><section class="section capabilities"><div class="section-grid"><div><p class="eyebrow reveal">What I do</p><h2 class="big-heading reveal">What I build.</h2></div><p class="intro-copy reveal"></p></div><div class="capability-list reveal">${data.home.capabilities.map((c,i)=>`<div class="capability"><small>${String(i+1).padStart(2,'0')}</small>${esc(c)}.</div>`).join('')}</div></section><hr class="rule">
${cats.map((cat,i)=>`<section id="${i===0?'work':''}" class="chapter"><div class="chapter-top"><span>Selected Work</span><span>${String(i+1).padStart(2,'0')} / ${String(cats.length).padStart(2,'0')}</span></div><h2 class="chapter-title reveal">${esc(cat).replace(' ','<br>')}<span class="dot">.</span></h2></section><section class="work-block">${data.projects.filter(p=>p.visible&&p.category===cat).map(p=>`<article class="project"><div class="project-copy"><div><div class="project-label"><span>${esc(p.category)}</span><span>${esc(p.client)}</span></div><h3 class="project-title reveal">${esc(p.title).replace(' · ','<br>').replace(' — ','<br>')}</h3><p class="project-role">${esc(p.role)}</p></div><dl class="project-description"><div class="field"><dt>Challenge</dt><dd>${esc(p.challenge)}</dd></div><div class="field"><dt>Response</dt><dd>${esc(p.response)}</dd></div><div class="field"><dt>Outcome</dt><dd>${esc(p.outcome)}</dd></div></dl><a class="case-link" href="${encodeURIComponent(p.id)}.html">View case study →</a></div><div class="visual wide">${p.cover?img(p.cover):'<div class="visual empty">Add cover from admin</div>'}</div></article>`).join('')}</section>`).join('')}
<section class="section" id="process"><p class="eyebrow reveal">Process</p><h2 class="big-heading reveal">How a project takes shape.</h2><ol class="process-list reveal">${data.home.process.map((p,i)=>`<li class="process-row"><span>${String(i+1).padStart(2,'0')}</span><strong>${esc(p[0])}</strong><p>${esc(p[1])}</p></li>`).join('')}</ol></section>
<section class="section experience"><div><p class="eyebrow reveal">Experience</p><h2 class="big-heading reveal">Where I've worked.</h2></div><ul class="exp-list reveal">${data.home.experience.map(e=>`<li class="exp-item"><span class="exp-date">${esc(e[0])}</span><div><p class="exp-role">${esc(e[1])}</p><p class="exp-company">${esc(e[2])}</p></div></li>`).join('')}</ul></section>
<section class="section about-wrap" id="about"><div class="portrait reveal"><img src="assets/paula-about.jpeg" alt="Paula Freire"></div><div class="about-text reveal"><p class="eyebrow">About</p><p class="intro-copy">Good design makes complexity feel simple, memorable and human.</p><p class="body-copy">I'm Paula, a Brand & Visual Communication Designer based in Buenos Aires. Over the last few years, I've worked on regional campaigns, employer branding, presentation design and communication systems for teams across Latin America.</p><p class="body-copy">I enjoy finding the balance between strategy and design, creating visuals that not only look good, but also help people understand, connect and take action.</p></div></section></main><footer class="contact" id="contact"><div class="chapter-top"><span>Contact</span><span>${esc(data.home.location)}</span></div><h2 class="contact-title reveal">Let’s build<br><span>thoughtful</span><br>visual experiences.</h2><div class="contact-bottom"><p class="contact-copy">
    </p><div class="contact-links"><a href="${esc(safeLink(data.links.email))}">Email</a><a href="${esc(safeLink(data.links.linkedin))}" target="_blank" rel="noopener">LinkedIn</a><a href="${esc(safeLink(data.links.behance))}" target="_blank" rel="noopener">Behance</a><a href="${esc(safeLink(data.links.resume))}" target="_blank" rel="noopener">Resume</a></div></div></footer>`;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script></body></html>
