<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Editor — Paula Portfolio</title><link rel="stylesheet" href="style.css"><script src="data.js"></script></head><body class="admin-body"><div id="login" class="login"><div class="panel" style="width:min(440px,100%)"><h1>Private Editor</h1><p class="notice">Demo local. Contraseña: <b>Pau2026</b></p><div class="field-admin"><label>Password</label><input id="pwd" type="password" placeholder="Ingresar contraseña"></div><button class="btn dark" onclick="login()">Ingresar</button></div></div><div id="admin" class="admin hidden"><div class="admin-shell"><aside class="panel"><h1>Portfolio CMS</h1><p class="notice">Editá en borrador y publicá cuando quieras. La web pública no muestra botones de edición.</p><div class="admin-nav"><button class="active" data-tab="home">Home</button><button data-tab="projects">Projects</button><button data-tab="theme">Theme</button><button data-tab="links">Links</button><button data-tab="data">Import / Export</button></div><div class="admin-actions"><button class="mini-btn" onclick="save()">Guardar borrador</button><button class="mini-btn" onclick="publish()">Publicar</button><button class="mini-btn" onclick="window.open('index.html','_blank')">Ver público</button></div><p class="notice" id="status"></p></aside><main class="panel"><div id="editor"></div></main></div></div><script>
let draft=getDraft(); let activeTab='home'; let activeProject=0; const status=document.getElementById('status');
function login(){ if(document.getElementById('pwd').value==='Pau2026'){document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');render()} else alert('Contraseña incorrecta para este demo.'); }
document.querySelectorAll('.admin-nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.admin-nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeTab=b.dataset.tab;render();});
function esc(s=''){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function field(label,path,type='text'){const val=path.split('.').reduce((o,k)=>o?.[k],draft)??'';return `<div class="field-admin"><label>${label}</label>${type==='textarea'?`<textarea data-path="${path}">${esc(val)}</textarea>`:`<input data-path="${path}" value="${esc(val)}">`}</div>`}
function bind(){document.querySelectorAll('[data-path]').forEach(el=>el.oninput=()=>{let keys=el.dataset.path.split('.');let obj=draft;while(keys.length>1)obj=obj[keys.shift()];obj[keys[0]]=el.value;});}
function render(){const e=document.getElementById('editor');
 if(activeTab==='home'){e.innerHTML=`<h2>Home</h2><div class="form-grid">${field('Name','home.name')}${field('Location','home.location')}${field('Kicker','home.kicker')}${field('Intro','home.intro','textarea')}</div><h2>Capabilities</h2><p class="notice">Una por línea.</p><textarea id="caps" style="width:100%;min-height:120px">${draft.home.capabilities.join('\n')}</textarea><h2>Process</h2>${draft.home.process.map((p,i)=>`<div class="project-admin"><div class="form-grid"><div class="field-admin"><label>Step title</label><input value="${esc(p[0])}" oninput="draft.home.process[${i}][0]=this.value"></div><div class="field-admin"><label>Step copy</label><textarea oninput="draft.home.process[${i}][1]=this.value">${esc(p[1])}</textarea></div></div></div>`).join('')}`;document.getElementById('caps').oninput=ev=>draft.home.capabilities=ev.target.value.split('\n').filter(Boolean);bind();}
 if(activeTab==='theme'){e.innerHTML=`<h2>Theme</h2><div class="form-grid">${['bg','ink','muted','line','black','white','ikb'].map(k=>`<div class="field-admin"><label>${k}</label><input type="color" data-path="theme.${k}" value="${draft.theme[k]}"></div>`).join('')}${field('Display Font','theme.fontDisplay')}${field('Body Font','theme.fontBody')}</div>`;bind();}
 if(activeTab==='links'){e.innerHTML=`<h2>Links</h2><div class="form-grid">${field('Email','links.email')}${field('LinkedIn','links.linkedin')}${field('Behance','links.behance')}${field('Resume','links.resume')}</div>`;bind();}
 if(activeTab==='projects'){const p=draft.projects[activeProject]||draft.projects[0];e.innerHTML=`<h2>Projects</h2><div class="admin-actions"><select onchange="activeProject=this.selectedIndex;render()">${draft.projects.map((p,i)=>`<option ${i===activeProject?'selected':''}>${esc(p.title)}</option>`).join('')}</select><button class="mini-btn" onclick="addProject()">+ Nuevo proyecto</button><button class="mini-btn" onclick="duplicateProject()">Duplicar</button><button class="mini-btn" onclick="removeProject()">Eliminar</button></div><div class="project-admin"><div class="form-grid">${field('ID','projects.'+activeProject+'.id')}${field('Category','projects.'+activeProject+'.category')}${field('Title','projects.'+activeProject+'.title')}${field('Client','projects.'+activeProject+'.client')}${field('Role','projects.'+activeProject+'.role')}${field('Cover image URL/path','projects.'+activeProject+'.cover')}${field('Headline','projects.'+activeProject+'.headline','textarea')}${field('Challenge','projects.'+activeProject+'.challenge','textarea')}${field('Response','projects.'+activeProject+'.response','textarea')}${field('Outcome','projects.'+activeProject+'.outcome','textarea')}</div><div class="field-admin"><label>Visible</label><select data-path="projects.${activeProject}.visible"><option value="true" ${p.visible?'selected':''}>Visible</option><option value="false" ${!p.visible?'selected':''}>Hidden</option></select></div></div><h2>Sections</h2>${p.sections.map((s,si)=>`<div class="project-admin"><div class="form-grid"><div class="field-admin"><label>Section title</label><input value="${esc(s.title)}" oninput="draft.projects[${activeProject}].sections[${si}].title=this.value"></div><div class="field-admin"><label>Section copy</label><textarea oninput="draft.projects[${activeProject}].sections[${si}].copy=this.value">${esc(s.copy)}</textarea></div></div><div class="field-admin"><label>Images / videos paths, one per line</label><textarea oninput="draft.projects[${activeProject}].sections[${si}].images=this.value.split('\\n').filter(Boolean)">${(s.images||[]).join('\n')}</textarea></div><button class="mini-btn" onclick="draft.projects[${activeProject}].sections.splice(${si},1);render()">Remove section</button></div>`).join('')}<button class="mini-btn" onclick="draft.projects[activeProject].sections.push({title:'New section',copy:'Section copy',images:[]});render()">+ Add section</button>`;bind();document.querySelectorAll('select[data-path]').forEach(el=>el.onchange=()=>{let keys=el.dataset.path.split('.');let obj=draft;while(keys.length>1)obj=obj[keys.shift()];obj[keys[0]]=el.value==='true';});}
 if(activeTab==='data'){e.innerHTML=`<h2>Import / Export</h2><p class="notice">Copiá este JSON para backup, o pegá una versión editada para restaurar.</p><textarea id="json" style="width:100%;min-height:420px">${esc(JSON.stringify(draft,null,2))}</textarea><div class="admin-actions"><button class="mini-btn" onclick="draft=JSON.parse(document.getElementById('json').value);save();render()">Importar JSON</button><button class="mini-btn" onclick="resetAll();location.reload()">Reset demo</button></div>`;}}
function save(){saveDraft(draft);status.textContent='Borrador guardado.';setTimeout(()=>status.textContent='',1800)}
function publish(){save();publishDraft();status.textContent='Publicado. Abrí la Home pública para verlo.';setTimeout(()=>status.textContent='',2500)}
function addProject(){draft.projects.push({id:'new-project',visible:true,category:'Campaign Design',title:'New Project',client:'Client',role:'Role',cover:'',headline:'Headline',challenge:'Challenge',response:'Response',outcome:'Outcome',sections:[{title:'Overview',copy:'Copy',images:[]}]});activeProject=draft.projects.length-1;render()}
function duplicateProject(){draft.projects.push(JSON.parse(JSON.stringify(draft.projects[activeProject])));draft.projects[draft.projects.length-1].id+='-copy';activeProject=draft.projects.length-1;render()}
function removeProject(){if(confirm('¿Eliminar proyecto?')){draft.projects.splice(activeProject,1);activeProject=0;render()}}
</script></body></html>
